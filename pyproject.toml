[project]
name = "driving-scenes"
version = "0.1.0"
description = "Traffic sign detection and road segmentation with one multi-task network on Virtual KITTI"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.4",
    "lightning>=2.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.4",
    "pycocotools>=2.0.8",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "torch>=2.8",
    "torchmetrics>=1.4",
    "torchvision>=0.23",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["driving_scenes*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
